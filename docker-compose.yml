services:
  yahu:
    build: .
    container_name: yahu
    ports:
      - "3000:3000"
    volumes:
      # Bind mount вместо именованного Docker-тома: файл с данными лежит прямо
      # в ./data внутри проекта — виден, копируется/бэкапится как обычный файл
      # и не может пропасть при `docker compose down -v`, `docker system prune`
      # или подобной чистке Docker-томов. Игнорируется git'ом (см. .gitignore),
      # поэтому push/pull кода в GitHub эту папку никак не затрагивает.
      - ./data:/app/data
    restart: unless-stopped
    # Раскомментируйте и заполните, если сервер работает на "засыпающем"
    # бесплатном хостинге с эфемерным диском (см. README, раздел "Хостинг,
    # который засыпает") — здесь для локального Docker это не нужно, диск и
    # так постоянный (bind mount выше).
    # environment:
    #   UPSTASH_REDIS_REST_URL: "https://xxxx.upstash.io"
    #   UPSTASH_REDIS_REST_TOKEN: "xxxxxxxx"
