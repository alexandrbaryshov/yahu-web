name: Keep-alive ping

# Не даёт бесплатному хостингу "усыпить" сервис по бездействию: Render
# засыпает через 15 минут без запросов, поэтому пингуем чаще — раз в 10
# минут, с запасом. Каждый пинг — это просто GET-запрос к /api/health
# (лёгкий, ничего не пишет и не нагружает сервер).
#
# Настройка (один раз):
#   Settings → Secrets and variables → Actions → вкладка Variables →
#   New repository variable → имя SITE_URL, значение — адрес вашего сайта
#   БЕЗ слэша на конце, например https://yahu.onrender.com
#
# Подробности и альтернативы (например, UptimeRobot, если не хочется
# держать это в GitHub) — в README, раздел "Хостинг, который засыпает".

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # позволяет запустить вручную из вкладки Actions — удобно для проверки настройки

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что SITE_URL настроен
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::error::Переменная SITE_URL не задана. Settings → Secrets and variables → Actions → Variables → New repository variable: SITE_URL = https://ваш-сайт.onrender.com"
            exit 1
          fi

      - name: Пинг /api/health
        run: |
          # Не роняем весь workflow, если пинг не удался (например, сайт как
          # раз просыпается после долгого простоя) — просто попробуем снова
          # через 10 минут по расписанию.
          curl -fsS --max-time 55 "${{ vars.SITE_URL }}/api/health" && echo "OK" || echo "Пинг не удался в этот раз — не критично, повторится по расписанию."
